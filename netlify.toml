[build]
  command   = "npm install"
  publish   = "public"
  functions = "netlify/functions"

[dev]
  command = "node server.js"
  port    = 3000

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["ejs"]
  included_files = ["views/**"]

[[redirects]]
  from   = "/*"
  to     = "/.netlify/functions/server"
  status = 200
